<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Joseph W Choi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
  </head>
  <body>
    <div class="wrapper">
      <nav class="topbar navbar navbar-expand-lg navbar-light bg-white">
        <a class="navbar-brand{ home }" href="/">
          <b>Joseph W Choi</b>
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            { nav }
          </ul>
        </div>
        <form class="nav-search" role="search">
          <input type="search" placeholder="Search" aria-label="Search" autocomplete="off">
          <button type="submit" aria-label="Search"><svg width="1em" height="1em" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg></button>
        </form>
        <button class="navbar-toggler" type="button" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </nav>
      <div class="main-content">
        <div class="container">
          { content }
        </div>
      </div>
      <div class="push"></div>
    </div>
    <footer class="footer d-flex align-items-center bg-white">
      <div class="container">
        <a class="footer-name" href="/"><strong>Joseph W Choi</strong></a>
        <br>
        <small>
          [
          <a href="mailto:{ email }">Email</a>
          |
          <a href="{ scholar }">Google Scholar</a>
          |
          <a href="{ linkedin }">LinkedIn</a>
          |
          <a href="{ github }">Github</a>
          |
          <a href="{ cv }">CV</a>
          ]
        </small>
      </div>
    </footer>

    <script src="/js/navbar.js"></script>
  </body>
</html>
